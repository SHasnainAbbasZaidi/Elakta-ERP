{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{% static 'operations/theme.js' %}"></script>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elakta ERP · Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
<link rel="stylesheet" href="{% static 'operations/theme.css' %}?v=20261003">
</head>
<body>
<div class="login-theme-toggle"><button type="button" data-theme-toggle class="btn btn-light border" aria-label="Switch theme" aria-pressed="false"><i class="bi bi-moon-stars" aria-hidden="true"></i></button></div>
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
            <h3 class="fw-bold mt-2">Elakta ERP</h3>
        </div>
        {% if form.errors %}
            <div class="alert alert-danger small">Invalid username or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold fs-5">Login</button>
        </form>
    </div>
</body>
</html>
