{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-pencil-square text-primary"></i> Edit Daily Task</h2>
    <a href="{% url 'daily_tasks' %}" class="btn btn-secondary">Cancel</a>
</div>
<hr>

<div class="card shadow-sm mb-4 border-0">
    <div class="card-body bg-light">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="fw-bold">Task Type *</label>
                    <select name="task_type" id="task_type_select" class="form-select" onchange="toggleCustomTask(this)" required>
                        <option value="Reminder" {% if task.task_type == 'Reminder' %}selected{% endif %}>Reminder</option>
                        <option value="Invoice" {% if task.task_type == 'Invoice' %}selected{% endif %}>Invoice</option>
                        <option value="Quotation" {% if task.task_type == 'Quotation' %}selected{% endif %}>Quotation</option>
                        <option value="Other" {% if task.task_type == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3 {% if task.task_type != 'Other' %}d-none{% endif %}" id="custom_task_div">
                    <label class="fw-bold text-danger">Custom Task Type *</label>
                    <input type="text" name="custom_task_type" class="form-control" value="{{ task.custom_task_type }}">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="fw-bold">Assign To User</label>
                    <select name="assigned_to" class="form-select">
                        <option value="">-- Select User --</option>
                        {% for u in users %}
                            <option value="{{ u.id }}" {% if task.assigned_to and task.assigned_to.id == u.id %}selected{% endif %}>{{ u.first_name|default:u.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="fw-bold">Date & Time *</label>
                    <input type="datetime-local" name="date_time" class="form-control" value="{{ task.date_time|date:'Y-m-d\TH:i' }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold text-primary">Client Name</label>
                    <select name="client_select" id="client_select" class="form-select">
                        <option value="">-- Select or Type Client --</option>
                        {% for c in clients %}
                            <option value="{{ c.id }}" {% if task.client and task.client.id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Task Status</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" name="is_open" id="is_open" class="form-check-input" {% if task.is_open %}checked{% endif %}>
                        <label class="form-check-label fw-bold text-success" for="is_open">Task is Open (Active)</label>
                    </div>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="fw-bold">Task Details / Remarks</label>
                    <textarea name="task_details" class="form-control" rows="3">{{ task.task_details }}</textarea>
                </div>
            </div>
            
            <div class="text-end">
                <button type="submit" class="btn btn-success fw-bold px-5 fs-5"><i class="bi bi-save"></i> Update Task</button>
            </div>
        </form>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#client_select').select2({ tags: true, placeholder: "-- Select or Type Client --", width: '100%' });
    });
    function toggleCustomTask(selectObj) {
        const customDiv = document.getElementById('custom_task_div');
        if (selectObj.value === 'Other') {
            customDiv.classList.remove('d-none');
        } else {
            customDiv.classList.add('d-none');
        }
    }
</script>
{% endblock %}
