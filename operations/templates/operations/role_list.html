{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-shield-lock"></i> Role Management</h2>
    <div>
        <a href="{% url 'user_list' %}" class="btn btn-secondary fw-bold me-2"><i class="bi bi-people"></i> Back to Users</a>
        <a href="{% url 'create_role' %}" class="btn btn-primary fw-bold"><i class="bi bi-plus-circle"></i> Create New Role</a>
    </div>
</div>
<hr>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <table class="table table-hover table-striped mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Role Name</th>
                    <th>Permissions Granted</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for role in roles %}
                <tr>
                    <td class="fw-bold fs-5 align-middle">{{ role.name }}</td>
                    <td class="align-middle">
                        <span class="badge bg-info text-dark">{{ role.permissions|length }} Modules</span>
                    </td>
                    <td class="text-center">
                        <a href="{% url 'edit_role' role.id %}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i> Edit Modules</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center text-muted py-5">No Roles created yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
