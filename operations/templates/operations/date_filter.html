<div class="d-flex flex-wrap align-items-end gap-2 date-filter">
<div><label class="form-label small" for="range-filter">Period</label><select id="range-filter" name="filter" class="form-select" data-date-preset><option value="all" {% if filter_type == 'all' %}selected{% endif %}>All time</option><option value="today" {% if filter_type == 'today' %}selected{% endif %}>Today</option><option value="week" {% if filter_type == 'week' %}selected{% endif %}>Last 7 days</option><option value="month" {% if filter_type == 'month' %}selected{% endif %}>Last 30 days</option><option value="custom" {% if filter_type == 'custom' %}selected{% endif %}>Custom</option></select></div>
<div data-date-fields class="{% if filter_type != 'custom' %}d-none{% endif %}"><label class="form-label small" for="range-start">From</label><input id="range-start" type="date" name="start_date" value="{{ start_date|date:'Y-m-d' }}" class="form-control" {% if filter_type != 'custom' %}disabled{% endif %}></div>
<div data-date-fields class="{% if filter_type != 'custom' %}d-none{% endif %}"><label class="form-label small" for="range-end">Through</label><input id="range-end" type="date" name="end_date" value="{{ end_date|date:'Y-m-d' }}" class="form-control" {% if filter_type != 'custom' %}disabled{% endif %}></div>
<button class="btn btn-primary" type="submit">Apply</button></div>
